server {
    listen 80;
    server_name _;

    # Proxy API calls to the backend container over Docker's internal network.
    # Same-origin from the browser's perspective, so no CORS config needed.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built SPA; fall back to index.html for client-side routing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
