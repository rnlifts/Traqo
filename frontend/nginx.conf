# Per-IP rate + connection limiting, declared here rather than the base image's
# main nginx.conf: this file is included inside the http{} context via
# /etc/nginx/conf.d/*.conf (see Dockerfile), which is a legal place for
# limit_req_zone/limit_conn_zone even though they read like "top of file".
#
# Why this exists: the VPS's public IP is (like any public IP) constantly hit by
# vulnerability-scanning bots probing for exposed .env/.git/config files, admin
# panels, etc. Every one of those requests still costs a request cycle through
# try_files below. On a small VPS, a heavy enough burst of that traffic was
# observed to delay nginx reading a legitimate, slower request (a POST with a
# body needing to be proxied to the backend) long enough to trip nginx's own
# client_body_timeout — nginx returned its own 408 to the client *before ever
# forwarding the request to the backend*, which is why it looked like the app
# "hung then failed" with zero trace in the backend's own logs. Rate/connection
# limiting keeps a single source from being able to create that kind of
# contention, without meaningfully constraining a real user (see burst values
# below vs. the app's actual concurrent-request pattern on page load).
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

server {
    listen 80;
    server_name _;

    # 20 req/s sustained per IP, burst up to 40 served immediately (the app's
    # own page loads fire well under 40 concurrent/rapid requests — Dashboard's
    # busiest load is ~10), and cap concurrent connections per IP at 20.
    # Excess requests get 429 (clearer than nginx's 503 default for this case)
    # instead of contending for read/proxy time with everyone else.
    limit_req zone=perip burst=40 nodelay;
    limit_conn perip_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Proxy API calls to the backend container over Docker's internal network.
    # Same-origin from the browser's perspective, so no CORS config needed.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built SPA; fall back to index.html for client-side routing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
