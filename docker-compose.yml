services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traqo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-traqo_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traqo_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-traqo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traqo_prod}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Same-origin via the frontend's Nginx reverse proxy — no cross-origin
      # requests reach the backend directly, but set for completeness/safety.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  frontend:
    build:
      context: ./frontend
      args:
        # Relative path: the browser talks to the same Nginx origin that
        # serves the SPA, which proxies /api to the backend container.
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Shared with the one-off certbot container: certbot writes challenge
      # files here for domain-ownership verification, nginx serves them.
      - certbot_webroot:/var/www/certbot
      # Where certbot writes the actual certificate files; nginx reads them
      # read-only. Populated by a one-off `certbot` container run manually
      # on the host, not by anything in this compose file.
      - certbot_certs:/etc/letsencrypt:ro

volumes:
  postgres_data:
  certbot_webroot:
  certbot_certs:

networks:
  # Pin the MTU to match the VPS host's real interface (confirmed via
  # `ip link show`: eth0 is capped at 1380, likely due to the provider's
  # underlying overlay/tunnel network). Docker's default bridge network
  # otherwise assumes the standard 1500 MTU, which silently black-holes any
  # packet that needs more than ~1 packet's worth of payload to cross the
  # real 1380 path — request bodies over roughly 1.2KB would hang until
  # nginx's client_body_timeout, never reaching the backend. Confirmed via a
  # request-size binary search: ~1064 bytes succeeded instantly, ~1364 bytes
  # hung for the full timeout, every single time, regardless of client.
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1380
