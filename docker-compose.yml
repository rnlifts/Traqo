services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traqo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-traqo_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traqo_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-traqo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traqo_prod}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Same-origin via the frontend's Nginx reverse proxy — no cross-origin
      # requests reach the backend directly, but set for completeness/safety.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  frontend:
    build:
      context: ./frontend
      args:
        # Relative path: the browser talks to the same Nginx origin that
        # serves the SPA, which proxies /api to the backend container.
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
